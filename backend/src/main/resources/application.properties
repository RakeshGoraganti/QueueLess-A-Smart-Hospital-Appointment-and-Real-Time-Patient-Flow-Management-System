spring.application.name=smart-hospital-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/smart_hospital?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-secret-123456789}
app.jwt.expiration-ms=86400000
